# Deployed as a Docker Swarm stack:  docker stack deploy -c docker-compose.yml consolidated
# (swarm services may join the non-attachable `mysql_public` overlay; standalone
#  `docker compose` containers cannot, which is why this is a stack.)
version: "3.8"

services:
  # Built on the REAL production schema (schema/consolidated_db_schema.sql, the
  # consolidated_db dump). MySQL 8 to match production; the schema is loaded on
  # first boot via /docker-entrypoint-initdb.d. Wipe the `consolidated-data`
  # volume to re-init from a changed schema.
  consolidated-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${CONSOLIDATED_ROOT_PW:-consolidated}
      MYSQL_DATABASE: ${CONSOLIDATED_DB:-consolidated_db}
    volumes:
      - consolidated-data:/var/lib/mysql
    configs:
      - source: consolidated_schema
        target: /docker-entrypoint-initdb.d/01-consolidated_db_schema.sql
    networks:
      - mysql_public
    deploy:
      replicas: 1

  cdc-reader:
    image: consolidated-cdc-reader:local
    environment:
      SRC_HOST: ${SRC_HOST:-mysql}
      SRC_PORT: "3306"
      SRC_USER: ${SRC_USER:-consolidated}
      SRC_PASS: ${SRC_PASS:-consolidated}
      SOURCE_SCHEMAS: ${SOURCE_SCHEMAS:-openmrs,openmrs2}
      # facility database -> production site code (mspp_code)
      SCHEMA_MSPP: ${SCHEMA_MSPP:-openmrs=11106,openmrs2=22207}
      SERVER_ID: "100001"
      DST_HOST: consolidated-db
      DST_PORT: "3306"
      DST_USER: root
      DST_PASS: ${CONSOLIDATED_ROOT_PW:-consolidated}
      DST_DB: ${CONSOLIDATED_DB:-consolidated_db}
      ENABLE_KAFKA: ${ENABLE_KAFKA:-1}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-fhir.patient.changed}
    networks:
      - mysql_public
      - cnet
    depends_on:
      - consolidated-db
      - kafka
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Kafka backbone (Pattern A): decouples the CDC reader from the SHR write.
  # Single-node KRaft broker; events buffer here if the SHR is down.
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - cnet
    deploy:
      replicas: 1

  # CDC-triggered fhir2 publisher, Kafka-consumer variant. Consumes patient-changed
  # events, pulls each patient's FHIR from the owning EMR's fhir2 API and forwards
  # to the SHR (+ MPI enroll). Needs cnet (Kafka), mysql_public (read
  # consolidated-db), openhim_public (openhim-core:5001 SHR+CR channels) and
  # isanteplus_public (EMR fhir2 APIs isanteplus:8080 / isanteplus2:8080 / ...).
  publisher:
    image: consolidated-cdc-reader:local
    command: ["python", "-u", "publisher_kafka.py"]
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-fhir.patient.changed}
      KAFKA_GROUP: ${KAFKA_GROUP:-consolidated-shr}
      WRITE_URL: ${WRITE_URL:-http://hapi-proxy:18080/fhir}
      DST_HOST: consolidated-db
      DST_PORT: "3306"
      DST_USER: root
      DST_PASS: ${CONSOLIDATED_ROOT_PW:-consolidated}
      DST_DB: ${CONSOLIDATED_DB:-consolidated_db}
      SHR_URL: ${SHR_URL:-http://openhim-core:5001/SHR/fhir}
      SHR_USER: ${SHR_USER:-shr-pipeline}
      SHR_PASS: ${SHR_PASS:-instant101}
      EMR_USER: ${EMR_USER:-admin}
      EMR_PASS: ${EMR_PASS:-Admin123}
      CR_URL: ${CR_URL:-http://openhim-core:5001/CR/fhir}
      CR_USER: ${CR_USER:-openshr}
      CR_PASS: ${CR_PASS:-openshr}
      ENROLL_MPI: ${ENROLL_MPI:-1}
      SYNC_GLOBALS: ${SYNC_GLOBALS:-1}
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-3600}
    networks:
      - mysql_public
      - openhim_public
      - isanteplus_public
      - cnet
    depends_on:
      - consolidated-db
      - kafka
    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  mysql_public:
    external: true
  openhim_public:
    external: true
  isanteplus_public:
    external: true
  cnet:        # stack-internal overlay: reader <-> kafka <-> publisher

configs:
  # the real production schema, loaded into consolidated-db on first boot
  consolidated_schema:
    file: ./schema/consolidated_db_schema.sql

volumes:
  consolidated-data:
  kafka-data:
