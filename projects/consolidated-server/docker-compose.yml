# Deployed as a Docker Swarm stack:  docker stack deploy -c docker-compose.yml consolidated
# (swarm services may join the non-attachable `mysql_public` overlay; standalone
#  `docker compose` containers cannot, which is why this is a stack.)
version: "3.8"

services:
  consolidated-db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ${CONSOLIDATED_ROOT_PW:-consolidated}
      MYSQL_DATABASE: ${CONSOLIDATED_DB:-consolidated}
    volumes:
      - consolidated-data:/var/lib/mysql
    networks:
      - mysql_public
    deploy:
      replicas: 1

  cdc-reader:
    image: consolidated-cdc-reader:local
    environment:
      SRC_HOST: ${SRC_HOST:-mysql}
      SRC_PORT: "3306"
      SRC_USER: ${SRC_USER:-consolidated}
      SRC_PASS: ${SRC_PASS:-consolidated}
      SOURCE_SCHEMAS: ${SOURCE_SCHEMAS:-openmrs,openmrs2}
      SERVER_ID: "100001"
      DST_HOST: consolidated-db
      DST_PORT: "3306"
      DST_USER: root
      DST_PASS: ${CONSOLIDATED_ROOT_PW:-consolidated}
      DST_DB: ${CONSOLIDATED_DB:-consolidated}
    networks:
      - mysql_public
    depends_on:
      - consolidated-db
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Phase 2: CDC-triggered fhir2 publisher. The binlog high-water mark tells us
  # which patients changed; for each we pull its FHIR from the owning EMR's
  # fhir2 API and forward to the SHR. Needs mysql_public (read consolidated-db),
  # openhim_public (reach openhim-core:5001 SHR channel) and isanteplus_public
  # (reach the EMR fhir2 APIs isanteplus:8080 / isanteplus2:8080 / ...).
  publisher:
    image: consolidated-cdc-reader:local
    command: ["python", "-u", "publisher_fhir2.py"]
    environment:
      DST_HOST: consolidated-db
      DST_PORT: "3306"
      DST_USER: root
      DST_PASS: ${CONSOLIDATED_ROOT_PW:-consolidated}
      DST_DB: ${CONSOLIDATED_DB:-consolidated}
      SHR_URL: ${SHR_URL:-http://openhim-core:5001/SHR/fhir}
      SHR_USER: ${SHR_USER:-shr-pipeline}
      SHR_PASS: ${SHR_PASS:-instant101}
      EMR_USER: ${EMR_USER:-admin}
      EMR_PASS: ${EMR_PASS:-Admin123}
      CR_URL: ${CR_URL:-http://openhim-core:5001/CR/fhir}
      CR_USER: ${CR_USER:-openshr}
      CR_PASS: ${CR_PASS:-openshr}
      ENROLL_MPI: ${ENROLL_MPI:-1}
      SYNC_GLOBALS: ${SYNC_GLOBALS:-1}
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-3600}
    networks:
      - mysql_public
      - openhim_public
      - isanteplus_public
    depends_on:
      - consolidated-db
    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  mysql_public:
    external: true
  openhim_public:
    external: true
  isanteplus_public:
    external: true

volumes:
  consolidated-data:
