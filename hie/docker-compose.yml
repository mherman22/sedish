# SEDISH "hie" stack — the SQLMesh → FHIR pipeline (consolidated-fhir-mapper).
# Deploy with ./deploy.sh (builds the pipeline image first; `docker stack deploy`
# does not build).
#
#   Consolidé (EXTERNAL, CHARESS-hosted) ─▶ fhir-pipeline ┬─ sqlmesh run (consolidated_db → fhir.*)
#                                                          └─ loader (Δ → OpenCR /CR, + SHR /SHR in Phase 2)
#
# ARCHITECTURE: the consolidated server ("Consolidé") is EXTERNAL — CHARESS gives us
# the MySQL connection details. We no longer run a local consolidated-db or CDC reader.
# SQLMesh runs against Consolidé's MySQL: it reads `consolidated_db` and writes its own
# `fhir` / `ref` / state schemas there, so it needs CREATE/write privileges on that
# server (source and output must be co-located — MySQL can't JOIN across servers).
# If Consolidé only grants read-only access, we instead point FHIR_DB_HOST at a local
# replica of consolidated_db (pending CHARESS's access model).
version: "3.8"

services:
  fhir-pipeline:
    # published image (GHCR package) — built/pushed by the pipeline repo's CI, not vendored here
    image: ghcr.io/mherman22/sedish-fhir-pipeline:${PIPELINE_TAG:-main}
    environment:
      # poll the source on a timer by default; switch to kafka only if Consolidé
      # publishes a patient-changed event stream we can point KAFKA_BROKERS at.
      RUN_MODE: ${RUN_MODE:-poll}
      INTERVAL: ${INTERVAL:-30}
      # Consolidé MySQL (EXTERNAL) — SQLMesh reads consolidated_db and writes fhir/ref/state here.
      FHIR_DB_HOST: ${CONSOLIDATED_HOST:?set CONSOLIDATED_HOST to the Consolidé MySQL host}
      FHIR_DB_PORT: ${CONSOLIDATED_PORT:-3306}
      FHIR_DB_USER: ${CONSOLIDATED_USER:?set CONSOLIDATED_USER}
      FHIR_DB_PASS: ${CONSOLIDATED_PASS:?set CONSOLIDATED_PASS}
      FHIR_DB_NAME: ${FHIR_DB_NAME:-fhir}
      NATIONAL_ID_SYSTEM: ${NATIONAL_ID_SYSTEM:-http://isanteplus.org/openmrs/fhir2/6-biometrics-national-reference-code}
      # Phase 1: push Patient identities to OpenCR only (MPI). Set MPI_ONLY=0 for Phase 2.
      MPI_ONLY: ${MPI_ONLY:-1}
      SOURCE_KEY_SYSTEM: ${SOURCE_KEY_SYSTEM:-http://sedish-haiti.org/fhir/source-key}
      # OpenHIM channels (push targets); enrolled as our own "Consolidated Server" client
      OPENCR_URL: ${OPENCR_URL:-http://openhim-core:5001/CR/fhir}
      OPENCR_USER: ${OPENCR_USER:-consolidated}
      OPENCR_PASS: ${OPENCR_PASS:-consolidated}
      SHR_URL: ${SHR_URL:-http://openhim-core:5001/SHR/fhir}
      SHR_USER: ${SHR_USER:-consolidated}
      SHR_PASS: ${SHR_PASS:-consolidated}
    networks: [openhim_public]
    deploy:
      replicas: 1
      restart_policy: { condition: any }

networks:
  openhim_public:
    external: true
