# DEMO/TEST ONLY — This package is not needed in production.
# In production, each facility runs its own pipeline pointing at its own
# iSantePlus instance. The aggregator only exists for demo/test setups
# where multiple iSantePlus instances share one pipeline on a single machine.
# To disable: remove fhir-aggregator-mediator from config.yaml and point
# the pipeline's fhirServerUrl directly at a single iSantePlus instance.

version: "3.9"

services:
  fhir-aggregator:
    image: ghcr.io/mherman22/fhir-aggregator-mediator:dev
    environment:
      - SOURCE_isanteplus_USERNAME=${ISANTEPLUS_USERNAME:-admin}
      - SOURCE_isanteplus_PASSWORD=${ISANTEPLUS_PASSWORD:-Admin123}
      - SOURCE_isanteplus2_USERNAME=${ISANTEPLUS_USERNAME:-admin}
      - SOURCE_isanteplus2_PASSWORD=${ISANTEPLUS_PASSWORD:-Admin123}
      - SOURCE_isanteplus3_USERNAME=${ISANTEPLUS_USERNAME:-admin}
      - SOURCE_isanteplus3_PASSWORD=${ISANTEPLUS_PASSWORD:-Admin123}
      - SOURCE_isanteplus4_USERNAME=${ISANTEPLUS_USERNAME:-admin}
      - SOURCE_isanteplus4_PASSWORD=${ISANTEPLUS_PASSWORD:-Admin123}
    configs:
      - source: aggregator_config
        target: /app/config/config.json
      - source: aggregator_mediator
        target: /app/config/mediator.json
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - openhim
      - isanteplus

configs:
  aggregator_config:
    file: ./config/config.json
    name: aggregator_config
    labels:
      name: aggregator_config
  aggregator_mediator:
    file: ./config/mediator.json
    name: aggregator_mediator
    labels:
      name: aggregator_mediator

networks:
  openhim:
    name: openhim_public
    external: true
  isanteplus:
    name: isanteplus_public
    external: true
