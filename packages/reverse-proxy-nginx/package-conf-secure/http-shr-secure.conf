server {
    listen          80;
    server_name     shr.*;

    location /.well-known/acme-challenge/ {
        resolver    127.0.0.11 valid=30s;
        set         $upstream_certbot certbot;
        proxy_pass  http://$upstream_certbot$request_uri;
    }

    location / {
        return      301 https://$host$request_uri;
    }
}
server {
    listen          443 ssl;
    listen          [::]:443 ssl;
    server_name     shr.*;

    location /.well-known/acme-challenge/ {
        resolver    127.0.0.11 valid=30s;
        set         $upstream_certbot certbot;
        proxy_pass  http://$upstream_certbot$request_uri;
    }

    location / {
        # Read-only access: only allow GET and HEAD requests.
        # All writes must flow through OpenHIM (port 5001) for audit and auth.
        limit_except GET HEAD {
            deny all;
        }

        # Basic auth on the public read endpoint (over HTTPS). Credentials live in the htpasswd
        # mounted from package-conf-secure/.htpasswd-shr. Rotate: regenerate that file
        # (htpasswd/openssl passwd -apr1) and redeploy reverse-proxy-nginx.
        auth_basic            "SEDISH SHR";
        auth_basic_user_file  /etc/nginx/conf.d/package-conf-secure/.htpasswd-shr;

        resolver    127.0.0.11 valid=30s;
        set         $upstream_hapi hapi-fhir_hapi-fhir;
        proxy_pass  http://$upstream_hapi:8080;
    }
}
