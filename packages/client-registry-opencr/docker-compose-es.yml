version: "3.9"

services:
  opencr-es:
    # Self-built (docker/opencr-es/Dockerfile): ES 7.9.1 + string-similarity-scoring v0.0.6, the plugin
    # that executes the decision-rule algorithms. Built as opencr-es:local by build-custom-images.sh —
    # replaces the floating, unpinned intrahealth/elasticsearch:latest so the matching stack is
    # reproducible and can't be swapped out from under the Client Registry.
    image: opencr-es:local
    build:
      context: ./docker/opencr-es
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - node.name=es01
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
    volumes:
      - es-data-new:/usr/share/elasticsearch/data
    networks:
      - default
      - opencr
    healthcheck:
      test: "curl --silent --fail http://localhost:9200/_cluster/health || exit 1"

volumes:
  es-data-new:

networks:
  opencr:
    external: true
    name: opencr
  default:
    