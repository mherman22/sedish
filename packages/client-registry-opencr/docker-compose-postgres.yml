version: "3.9"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_MULTIPLE_DATABASES: opencr,shr
      POSTGRES_PASSWORD: postgres
    volumes:
      # Named, not anonymous. An anonymous volume is recreated empty every time the service is
      # created, so `docker stack rm` + redeploy silently destroyed the registry's records while
      # the Elasticsearch index survived, leaving the two permanently out of step.
      - opencr-postgres-data:/var/lib/postgresql/data/
  
    configs:
      - target: /docker-entrypoint-initdb.d/multiple-db.sh
        source: multiple-db.sh
   
    networks:
      opencr:
      default:

volumes:
  opencr-postgres-data:

configs:
  multiple-db.sh:
    file: ./config/postgres/multiple-db.sh
    name: multiple-db.sh
    labels:
      name: multiple-db.sh

networks:
  default:
  opencr:
    name: opencr
    external: true