version: "3.9"

services:
  mysql:
    image: ${MYSQL_IMAGE}
    command: mysqld --character-set-server=utf8 --collation-server=utf8_general_ci --sql_mode=""
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PW}
      - OPENMRS_DB_COUNT=${OPENMRS_DB_COUNT}
      - INITIAL_SQL_FILE=${INITIAL_SQL_FILE}
      - MYSQL_ROOT_HOST=% # Allow docker containers to connect to mysql
    networks:
      - mysql
    configs:
      - source: mysql.cnf
        target: /etc/mysql/conf.d/custom.cnf
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: ${MYSQL_CPU_LIMIT:-0}
          memory: ${MYSQL_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${MYSQL_CPU_RESERVE:-0.1}
          memory: ${MYSQL_MEMORY_RESERVE:-256M}
configs:
  mysql.cnf:
    file: ./config/mysql.cnf
    name: mysql.cnf
    labels:
      name: mysql

networks:
  mysql:
    external: true
    name: mysql_public

