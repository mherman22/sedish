version: "3.8"

# Maps the external Consolidé consolidated_db to FHIR and pushes the delta to OpenCR.
# Set CONSOLIDATED_HOST/USER/PASS (the Consolidé MySQL). Everything else — OpenHIM
# channel URLs, identifier systems, poll interval — uses the image's built-in defaults.
# PIPELINE_IMAGE defaults to the GHCR package; set it to sedish-fhir-pipeline:local to use a
# locally-built image (build-custom-images.sh) instead of pulling.
services:
  fhir-pipeline:
    image: ${PIPELINE_IMAGE}
    environment:
      FHIR_DB_HOST: ${CONSOLIDATED_HOST}
      FHIR_DB_PORT: ${CONSOLIDATED_PORT}
      FHIR_DB_USER: ${CONSOLIDATED_USER}
      FHIR_DB_PASS: ${CONSOLIDATED_PASS}
      MPI_ONLY: ${MPI_ONLY}
      OPENHIM_USER: ${OPENHIM_USER}
      OPENHIM_PASS: ${OPENHIM_PASS}
    networks: [openhim]
    deploy:
      replicas: 1
      restart_policy: { condition: any }

networks:
  openhim:
    name: openhim_public
    external: true
