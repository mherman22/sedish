version: "3.8"

# SYNC mode (default) — Consolidé is read-only to us, so a local pipeline-db holds a synced copy of
# consolidated_db + the FHIR output, and SQLMesh transforms there. Needs only SELECT on Consolidé.
# Steady state copies only changed rows; a periodic reconcile catches edits/deletes.
# Write-access deployments that skip the copy use docker-compose.direct.yml.
services:
  pipeline-db:
    image: mysql:8.0
    command: ["--sql-mode="]                    # tolerate iSantePlus legacy zero-dates in the copy
    environment:
      MYSQL_ROOT_PASSWORD: ${PIPELINE_DB_PW:-pipeline}
    volumes:
      - pipeline-db-data:/var/lib/mysql
    networks: [pipeline]
    deploy:
      replicas: 1
      restart_policy: { condition: any }

  fhir-pipeline:
    # public DIGI-UW GHCR package (CI publishes :main on push to main)
    image: ${PIPELINE_IMAGE:-ghcr.io/digi-uw/sedish-fhir-pipeline:main}
    environment:
      FHIR_DB_HOST: pipeline-db                 # SQLMesh reads the synced source + writes fhir here
      FHIR_DB_PORT: "3306"
      FHIR_DB_USER: root
      FHIR_DB_PASS: ${PIPELINE_DB_PW:-pipeline}
      FHIR_DB_NAME: ${FHIR_DB_NAME:-fhir}
      SRC_HOST: ${CONSOLIDATED_HOST}            # external read-only Consolidé the sync copies from
      SRC_PORT: ${CONSOLIDATED_PORT:-3306}
      SRC_USER: ${CONSOLIDATED_USER}
      SRC_PASS: ${CONSOLIDATED_PASS}
      OPENHIM_USER: ${OPENHIM_USER:-consolidated}
      OPENHIM_PASS: ${OPENHIM_PASS:-consolidated}
      # Retract SHR clinical the source no longer produces (void/delete propagation). 0 = off.
      RECONCILE_RETRACT_EVERY: ${RECONCILE_RETRACT_EVERY:-3600}
      # FHIR system URIs / attribute for the SQLMesh @VAR() mappings. CHARESS-provided; must match
      # OpenCR config + the SHR app.mpiSystem. Set per deployment via .env; empty falls back to the
      # canonical SEDISH value below (so an unset var never blanks the system). SQLMESH__VARIABLES__
      # is SQLMesh's built-in override for the @VAR variables.
      SQLMESH__VARIABLES__NATIONAL_ID_SYSTEM: ${NATIONAL_ID_SYSTEM:-http://isanteplus.org/openmrs/fhir2/6-biometrics-national-reference-code}
      SQLMESH__VARIABLES__SOURCE_KEY_SYSTEM: ${SOURCE_KEY_SYSTEM:-http://sedish-haiti.org/fhir/source-key}
      SQLMESH__VARIABLES__MSPP_SITE_SYSTEM: ${MSPP_SITE_SYSTEM:-http://sedish-haiti.org/fhir/mspp-site}
      SQLMESH__VARIABLES__DRUG_SYSTEM: ${DRUG_SYSTEM:-http://isanteplus.org/openmrs/drug}
      SQLMESH__VARIABLES__PHONE_ATTRIBUTE_NAME: ${PHONE_ATTRIBUTE_NAME:-Telephone Number}
    networks: [openhim, pipeline]
    depends_on: [pipeline-db]
    deploy:
      replicas: 1
      restart_policy: { condition: any }

networks:
  openhim:
    name: openhim_public
    external: true
  pipeline:

volumes:
  pipeline-db-data:
