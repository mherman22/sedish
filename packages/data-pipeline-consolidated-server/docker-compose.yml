version: "3.8"

# DIRECT mode: SQLMesh runs on Consolidé (no local copy). CONSOLIDATED_* = write-capable user.
services:
  fhir-pipeline:
    image: ${PIPELINE_IMAGE}
    environment:
      FHIR_DB_HOST: ${CONSOLIDATED_HOST}
      FHIR_DB_PORT: ${CONSOLIDATED_PORT}
      FHIR_DB_USER: ${CONSOLIDATED_USER}
      FHIR_DB_PASS: ${CONSOLIDATED_PASS}
      FHIR_DB_NAME: ${FHIR_DB_NAME:-fhir}
      FHIR_TEST_DB: ""        # no test gateway in prod
      ENSURE_DBS: "0"         # schemas pre-created by CHARESS; don't CREATE
      STATE_DB: ${FHIR_DB_NAME:-fhir}
      OPENHIM_USER: ${OPENHIM_USER:-consolidated}
      OPENHIM_PASS: ${OPENHIM_PASS:-consolidated}
    networks: [openhim]
    deploy:
      replicas: 1
      restart_policy: { condition: any }

networks:
  openhim:
    name: openhim_public
    external: true
