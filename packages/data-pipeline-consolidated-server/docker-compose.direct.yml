version: "3.8"

# DIRECT mode (write access to Consolidé) — SQLMesh runs on Consolidé itself and writes the
# fhir/sqlmesh/sqlmesh__fhir schemas there; no local copy. CONSOLIDATED_* is the write-capable user.
# To use: cp docker-compose.direct.yml docker-compose.yml, set swarm.sh SERVICE_NAMES to
# (fhir-pipeline), then ./build-image.sh. Schemas must be pre-created (ENSURE_DBS=0).
services:
  fhir-pipeline:
    image: ${PIPELINE_IMAGE}
    environment:
      FHIR_DB_HOST: ${CONSOLIDATED_HOST}        # Consolidé is the SQLMesh DB (source + output)
      FHIR_DB_PORT: ${CONSOLIDATED_PORT:-3306}
      FHIR_DB_USER: ${CONSOLIDATED_USER}
      FHIR_DB_PASS: ${CONSOLIDATED_PASS}
      FHIR_DB_NAME: ${FHIR_DB_NAME:-fhir}
      FHIR_TEST_DB: ""                          # no test gateway in production
      ENSURE_DBS: "0"                           # schemas pre-created by CHARESS; don't CREATE
      STATE_DB: ${FHIR_DB_NAME:-fhir}           # loader state lives inside fhir (no extra schema)
      OPENHIM_USER: ${OPENHIM_USER:-consolidated}
      OPENHIM_PASS: ${OPENHIM_PASS:-consolidated}
    networks: [openhim]
    deploy:
      replicas: 1
      restart_policy: { condition: any }

networks:
  openhim:
    name: openhim_public
    external: true
