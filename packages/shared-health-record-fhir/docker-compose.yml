version: '3.8'

services:
  shr:
    # develop is the active branch (consolidated IPS + link-only #144 merged there); CI publishes
    # itechuw/shared-health-record:develop. :main lags and lacks that work.
    image: ${SHR_IMAGE:-itechuw/shared-health-record:develop}
    networks:
      - openhim
      - shr
      - hapi-fhir
    configs:
      - source: shr_config
        target: /app/config/config_docker.json
      - source: shr_mediator
        target: /app/config/mediator_docker.json
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
configs:
  shr_config:
    file: ./config/config.json
    labels:
      name: shr
  shr_mediator:
    file: ./config/mediator.json
    labels:
      name: shr

networks:
  openhim:
    name: openhim_public
    external: true
  shr:
    name: shr
    external: true
  hapi-fhir:
    name: hapi-fhir_public
    external: true