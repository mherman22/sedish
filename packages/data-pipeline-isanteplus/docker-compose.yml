version: "3.9"

services:
  streaming-pipeline:
    image: us-docker.pkg.dev/cloud-build-fhir/fhir-analytics/main:latest
    environment:
      - JAVA_OPTS=-Xms2g -Xmx2g
      - FLINK_CONF_DIR=/app/config
    configs:
      - source: application_yaml
        target: /app/config/application.yaml
      - source: flink_conf_yaml
        target: /app/config/flink-conf.yaml
    volumes:
      - pipeline-dwh:/dwh
    ports:
      - target: 8080
        published: 8095
        protocol: tcp
        mode: host
    networks:
      - openhim
      - shr
      - isanteplus
      - hapi-fhir
      - reverse-proxy

configs:
  application_yaml:
    file: ./config/application.yaml
    name: pipeline_application_yaml
    labels:
      name: pipeline_application_yaml
  flink_conf_yaml:
    file: ./config/flink-conf.yaml
    name: pipeline_flink_conf_yaml
    labels:
      name: pipeline_flink_conf_yaml

volumes:
  pipeline-dwh:

networks:
  openhim:
    name: openhim_public
    external: true
  shr:
    name: shr
    external: true
  mysql:
    name: mysql_public
    external: true
  isanteplus:
    name: isanteplus_public
    external: true
  hapi-fhir:
    name: hapi-fhir_public
    external: true
  reverse-proxy:
    name: reverse-proxy_public
    external: true
