version: "3.9"

services:
  pipeline-isanteplus1:
    image: us-docker.pkg.dev/cloud-build-fhir/fhir-analytics/main:latest
    environment:
      - JAVA_OPTS=-Xms1g -Xmx1g
      - FLINK_CONF_DIR=/app/config
    configs:
      - source: application_isanteplus1_yaml
        target: /app/config/application.yaml
      - source: flink_conf_yaml
        target: /app/config/flink-conf.yaml
    volumes:
      - pipeline-dwh-1:/dwh
    networks:
      - openhim
      - shr
      - isanteplus
      - hapi-fhir
      - reverse-proxy

  pipeline-isanteplus2:
    image: us-docker.pkg.dev/cloud-build-fhir/fhir-analytics/main:latest
    environment:
      - JAVA_OPTS=-Xms1g -Xmx1g
      - FLINK_CONF_DIR=/app/config
    configs:
      - source: application_isanteplus2_yaml
        target: /app/config/application.yaml
      - source: flink_conf_yaml
        target: /app/config/flink-conf.yaml
    volumes:
      - pipeline-dwh-2:/dwh
    networks:
      - openhim
      - shr
      - isanteplus
      - hapi-fhir
      - reverse-proxy

configs:
  application_isanteplus1_yaml:
    file: ./config/application-isanteplus1.yaml
  application_isanteplus2_yaml:
    file: ./config/application-isanteplus2.yaml
  flink_conf_yaml:
    file: ./config/flink-conf.yaml

volumes:
  pipeline-dwh-1:
  pipeline-dwh-2:

networks:
  openhim:
    name: openhim_public
    external: true
  shr:
    name: shr
    external: true
  mysql:
    name: mysql_public
    external: true
  isanteplus:
    name: isanteplus_public
    external: true
  hapi-fhir:
    name: hapi-fhir_public
    external: true
  reverse-proxy:
    name: reverse-proxy_public
    external: true
