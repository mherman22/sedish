version: "3.9"

services:
  # Auth-injecting gateway proxy for iSantePlus FHIR endpoints.
  # The fhir-data-pipes Flink workers cannot pass Basic auth credentials,
  # so this proxy adds the Authorization header before forwarding.
  gateway:
    image: nginx:stable
    configs:
      - source: gateway_conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - isanteplus

  streaming-pipeline:
    image: us-docker.pkg.dev/cloud-build-fhir/fhir-analytics/main:latest
    entrypoint: /app/config/wait-and-start.sh
    environment:
      - JAVA_OPTS=-Xms2g -Xmx2g
      - FLINK_CONF_DIR=/app/config
      - fhirdata.fhirServerUrl=http://gateway:8090/isanteplus/openmrs/ws/fhir2/R4
      - fhirdata.sinkFhirServerUrl=http://hapi-fhir:8080/fhir
      - fhirdata.dwhRootPrefix=/dwh/pipeline_DWH
    configs:
      - source: application_yaml
        target: /app/config/application.yaml
      - source: flink_conf_yaml
        target: /app/config/flink-conf.yaml
      - source: wait_and_start
        target: /app/config/wait-and-start.sh
        mode: 0755
    volumes:
      - pipeline-dwh:/dwh
    ports:
      - target: 8080
        published: 8095
        protocol: tcp
        mode: host
    deploy:
      restart_policy:
        condition: on-failure
        delay: 30s
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G
    networks:
      - isanteplus
      - openhim
      - shr
      - hapi-fhir

  streaming-pipeline-2:
    image: us-docker.pkg.dev/cloud-build-fhir/fhir-analytics/main:latest
    entrypoint: /app/config/wait-and-start.sh
    environment:
      - JAVA_OPTS=-Xms2g -Xmx2g
      - FLINK_CONF_DIR=/app/config
      - fhirdata.fhirServerUrl=http://gateway:8090/isanteplus2/openmrs/ws/fhir2/R4
      - fhirdata.sinkFhirServerUrl=http://hapi-fhir:8080/fhir
      - fhirdata.dwhRootPrefix=/dwh/pipeline_DWH2
    configs:
      - source: application_yaml
        target: /app/config/application.yaml
      - source: flink_conf_yaml
        target: /app/config/flink-conf.yaml
      - source: wait_and_start
        target: /app/config/wait-and-start.sh
        mode: 0755
    volumes:
      - pipeline-dwh-2:/dwh
    ports:
      - target: 8080
        published: 8096
        protocol: tcp
        mode: host
    deploy:
      restart_policy:
        condition: on-failure
        delay: 30s
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G
    networks:
      - isanteplus
      - openhim
      - shr
      - hapi-fhir

  streaming-pipeline-3:
    image: us-docker.pkg.dev/cloud-build-fhir/fhir-analytics/main:latest
