configs:
  application_yaml:
    file: ./config/application.yaml
    name: pipeline_application_yaml
    labels:
      name: pipeline_application_yaml
  flink_conf_yaml:
    file: ./config/flink-conf.yaml
    name: pipeline_flink_conf_yaml
    labels:
      name: pipeline_flink_conf_yaml
  wait_and_start:
    file: ./config/wait-and-start.sh
    name: pipeline_wait_and_start
    labels:
      name: pipeline_wait_and_start
  gateway_conf:
    file: ./config/gateway.conf
    name: pipeline_gateway_conf
    labels:
      name: pipeline_gateway_conf

volumes:
  pipeline-dwh:
  pipeline-dwh-2:
  pipeline-dwh-3:
  pipeline-dwh-4:

networks:
  openhim:
    name: openhim_public
    external: true
  shr:
    name: shr
    external: true
  isanteplus:
    name: isanteplus_public
    external: true
  hapi-fhir:
    name: hapi-fhir_public
    external: true
