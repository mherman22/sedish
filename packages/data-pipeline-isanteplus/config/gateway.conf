resolver 127.0.0.11 valid=30s;

# Auth-injecting gateway for the FHIR data pipeline.
# The fhir-data-pipes Flink workers cannot pass Basic auth credentials
# (credentials are not serialized in Beam PipelineOptions).
# This proxy adds the Authorization header before forwarding to iSantePlus.

server {
    listen 8090;

    location /isanteplus/ {
        set $upstream isanteplus;
        rewrite ^/isanteplus/(.*) /$1 break;
        proxy_pass http://$upstream:8080;
        proxy_set_header Authorization "Basic YWRtaW46QWRtaW4xMjM=";
        proxy_set_header Host $host;
    }

    location /isanteplus2/ {
        set $upstream isanteplus2;
        rewrite ^/isanteplus2/(.*) /$1 break;
        proxy_pass http://$upstream:8080;
        proxy_set_header Authorization "Basic YWRtaW46QWRtaW4xMjM=";
        proxy_set_header Host $host;
    }

    location /isanteplus3/ {
        set $upstream isanteplus3;
        rewrite ^/isanteplus3/(.*) /$1 break;
        proxy_pass http://$upstream:8080;
        proxy_set_header Authorization "Basic YWRtaW46QWRtaW4xMjM=";
        proxy_set_header Host $host;
    }

    location /isanteplus4/ {
        set $upstream isanteplus4;
        rewrite ^/isanteplus4/(.*) /$1 break;
        proxy_pass http://$upstream:8080;
        proxy_set_header Authorization "Basic YWRtaW46QWRtaW4xMjM=";
        proxy_set_header Host $host;
    }
}
