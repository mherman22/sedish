fhirdata:
  fhirFetchMode: "FHIR_SEARCH"

  # Source FHIR server — routed through the auth-injecting gateway proxy.
  # The gateway adds Basic auth headers because fhir-data-pipes Flink workers
  # cannot pass credentials (they are not serialized in Beam PipelineOptions).
  # Each pipeline instance overrides this URL via env var to point to a different
  # iSantePlus instance through the gateway.
  fhirServerUrl: "http://gateway:8090/isanteplus/openmrs/ws/fhir2/R4"

  # Sink — writes directly to HAPI FHIR (no auth required, no OpenHIM needed).
  # OpenHIM is for external API governance, not internal ETL pipelines.
  sinkFhirServerUrl: "http://hapi-fhir:8080/fhir"
  sinkDbConfigPath:

  dwhRootPrefix: "/dwh/pipeline_DWH"
  generateParquetFiles: false

  # Pipeline schedule — incremental sync every 5 minutes
  incrementalSchedule: "0 */5 * * * *"
  purgeSchedule: "0 */10 * * * *"
  numOfDwhSnapshotsToRetain: 2

  resourceList: "Patient,Encounter,Observation,Condition,AllergyIntolerance,MedicationRequest,Practitioner,Group"

  fhirVersion: "R4"
  numThreads: 1
  autoGenerateFlinkConfiguration: true
  rowGroupSizeForParquetFiles: 33554432  # 32mb
  recursiveDepth: 1
  structureDefinitionsPath: "classpath:/r4-us-core-definitions"
  createHiveResourceTables: false
  createParquetViews: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,pipeline-metrics
