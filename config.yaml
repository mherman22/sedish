projectName: sedish-haiti
image: itechuw/sedish-haiti:latest
logPath: /tmp/logs

packages:
  - interoperability-layer-openhim
  - reverse-proxy-nginx
  - database-postgres
  - database-mysql
  - fhir-datastore-hapi-fhir
  - shared-health-record-fhir
  - client-registry-opencr
  - emr-isanteplus
  # EMR → SHR is the consolidated → FHIR pipeline (the separate `hie` stack:
  # consolidated-server + consolidated-fhir-mapper), not an instant package — see hie/README.md.
  # (It owns Patient/Encounter/Observation/AllergyIntolerance/Condition/MedicationRequest
  # + Location. Practitioner & Group are not pushed to the SHR — no source in consolidated_db.)
  # Not needed for core HIE — uncomment to enable:
  # - monitoring                        # Grafana/Prometheus/Loki (~7 containers, ~3GB RAM)
  # - identity-access-manager-keycloak  # SSO — OpenHIM works without it (~1GB RAM)
  # - analytics-datastore-elastic-search # Kibana analytics — OpenCR bundles its own ES (~3GB RAM)
  - lnsp-mediator                     # Lab integration — not in active use (~500MB RAM)
